name: Wydanie

# Jedno wydanie pod ruchomą etykietą „najnowsza", odświeżane przy każdym wejściu na
# main. Wersji jeszcze nie numerujemy, a dwadzieścia wydań dziennie byłoby listą,
# z której nic nie wynika — z czego powstało, mówi opis.
#
# Nazwy plików są STAŁE, więc odnośnik do pobrania nigdy się nie zmienia i zawsze
# prowadzi na najnowsze budowanie:
#   https://github.com/kodalus/Castellan/releases/download/najnowsza/castellan.apk
#   https://github.com/kodalus/Castellan/releases/download/najnowsza/castellan-windows.zip
#
# Artefakt przebiegu by tu nie wystarczył: przychodzi zapakowany w ZIP i tylko po
# zalogowaniu, więc trzeba go pobrać na komputerze i przełożyć na telefon. Wydanie to
# pojedynczy plik pod stałym adresem, bez logowania i bez archiwum — telefon pobiera
# go sam.
#
# Castellan ma dwa wydania naraz i nie da się ich zbudować na jednej maszynie: APK
# wymaga workloadu Androida (najtaniej na Linuksie), a wersja na pulpit wymaga WinUI,
# czyli Windowsa. Stąd dwa zadania budujące i TRZECIE, które dopiero z ich wyników
# składa wydanie. Gdyby każde dopisywało się samo, w opisie zostawałaby suma tego
# pliku, którego zadanie skończyło później — czyli losowego.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  apk:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Workload Androida
        run: dotnet workload install maui-android

      # Bez wlasnego klucza kazdy przebieg generowalby swoj klucz diagnostyczny, wiec
      # kazda kolejna wersja mialaby inny podpis i Android odmawialby aktualizacji —
      # trzeba by odinstalowywac aplikacje (i tracic baze) przy KAZDYM wydaniu.
      # Dlatego brak sekretu jest bledem, a nie cichym powrotem do starego zachowania.
      - name: Klucz podpisu
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Brak sekretu ANDROID_KEYSTORE_BASE64 — APK bylby podpisany kluczem jednorazowym."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/castellan.keystore"
          test -s "$RUNNER_TEMP/castellan.keystore"

      - name: Publikacja APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          dotnet publish src/Castellan.App/Castellan.App.csproj -f net10.0-android36.0 -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/castellan.keystore" \
            -p:AndroidSigningStorePass="$KS_PASS" \
            -p:AndroidSigningKeyAlias="$KS_ALIAS" \
            -p:AndroidSigningKeyPass="$KS_PASS"

      - name: Zebranie pakietu
        run: |
          mkdir -p artefakty

          PAKIET=$(find src/Castellan.App/bin/Release -name '*-Signed.apk' | head -n 1)

          if [ -z "$PAKIET" ]; then
            ILE=$(find src/Castellan.App/bin/Release -name '*.apk' | wc -l)
            if [ "$ILE" != "1" ]; then
              echo "::error::Nie da się wskazać pakietu — znalezionych APK: $ILE."
              find src/Castellan.App/bin/Release -name '*.apk'
              exit 1
            fi
            PAKIET=$(find src/Castellan.App/bin/Release -name '*.apk')
          fi

          cp "$PAKIET" artefakty/castellan.apk
          ls -l artefakty

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artefakty/castellan.apk
          if-no-files-found: error

      - name: Sprzatniecie klucza
        if: always()
        run: rm -f "$RUNNER_TEMP/castellan.keystore"

  pulpit:
    name: Windows (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Workload Windows
        run: dotnet workload install maui-windows

      # Bez -r i bez --self-contained: jedno i drugie przestawia SDK na pakiet
      # uruchomieniowy Mono (przyniesiony przez target Androida), którego dla win-x64
      # nie ma w ogóle. Domyślne ustawienia tego targetu dają to, co trzeba — razem
      # z WindowsAppSDKSelfContained z pliku projektu.
      - name: Publikacja na pulpit
        run: dotnet publish src/Castellan.App/Castellan.App.csproj -f net10.0-windows10.0.19041.0 -c Release

      - name: Spakowanie
        shell: pwsh
        run: |
          $pub = Get-ChildItem -Path "src/Castellan.App/bin/Release/net10.0-windows10.0.19041.0" `
                               -Directory -Recurse -Filter "publish" | Select-Object -First 1
          if (-not $pub) { throw "Nie znaleziono katalogu publish" }

          $exe = Join-Path $pub.FullName "Castellan.App.exe"
          if (-not (Test-Path $exe)) { throw "W katalogu publish nie ma Castellan.App.exe" }

          New-Item -ItemType Directory -Force -Path artefakty | Out-Null
          Compress-Archive -Path (Join-Path $pub.FullName '*') `
                           -DestinationPath "artefakty/castellan-windows.zip" `
                           -CompressionLevel Optimal
          Get-ChildItem artefakty

      - uses: actions/upload-artifact@v4
        with:
          name: pulpit
          path: artefakty/castellan-windows.zip
          if-no-files-found: error

  wydanie:
    name: Odświeżenie wydania
    needs: [apk, pulpit]
    runs-on: ubuntu-latest
    steps:
      # Potrzebny tylko dla pliku z notatkami — trzymanie ich w repozytorium zamiast
      # w tym pliku omija cytowanie wielu linii w YAML-u i w powłoce naraz.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefakty
          merge-multiple: true

      # Sumy kontrolne są po to, żeby dało się sprawdzić, czy plik, który doszedł na
      # telefon, jest tym, który tu powstał — a nie żeby uspokajać. To jedyna rzecz,
      # którą da się o pliku stwierdzić z zewnątrz bez zaufania komukolwiek.
      - name: Wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=artefakty/castellan.apk
          ZIP=artefakty/castellan-windows.zip

          ls -l artefakty
          test -f "$APK"
          test -f "$ZIP"

          SUMA_APK=$(sha256sum "$APK" | awk '{print $1}')
          SUMA_ZIP=$(sha256sum "$ZIP" | awk '{print $1}')

          {
            printf 'Budowanie z `%s`\n\n' "${GITHUB_SHA:0:7}"
            printf 'SHA-256 `castellan.apk`: `%s`\n\n' "$SUMA_APK"
            printf 'SHA-256 `castellan-windows.zip`: `%s`\n\n' "$SUMA_ZIP"
            printf 'Pliki pobrane u siebie powinny mieć te same sumy.\n\n---\n\n'
            cat .github/notatki-wydania.md
          } > opis.md

          if gh release view najnowsza >/dev/null 2>&1; then
            gh release upload najnowsza "$APK" "$ZIP" --clobber
            gh release edit najnowsza --notes-file opis.md
          else
            gh release create najnowsza "$APK" "$ZIP" \
              --title "Castellan — najnowsze budowanie" \
              --notes-file opis.md
          fi
